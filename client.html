<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo Sát Tâm Lý Khối 9</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 15px; color: #333; line-height: 1.5; }
        .header { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .question-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .question-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #1a5f7a; }
        .btn {
            display: block; width: 100%; text-align: left; padding: 15px; margin-bottom: 10px;
            font-size: 16px; background-color: #f8f9fa; color: #2c3e50; border: 2px solid #dee2e6;
            border-radius: 10px; cursor: pointer; transition: all 0.2s;
        }
        .btn.selected { background-color: #27ae60; color: white; border-color: #2ecc71; font-weight: bold; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .status { color: #e67e22; font-weight: bold; margin-top: 10px; display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Đồng Hành Cùng Con Vượt Vũ Môn</h2>
        <p>Phụ huynh vui lòng chọn phương án phù hợp nhất với mình.</p>
    </div>
    
    <div id="quiz-container"></div>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyC9oCTAWtIKvSmjKaI9CGrANIig5be6fzM",
            authDomain: "zoomquizthcs.firebaseapp.com",
            databaseURL: "https://zoomquizthcs-default-rtdb.firebaseio.com",
            projectId: "zoomquizthcs",
            storageBucket: "zoomquizthcs.firebasestorage.app",
            messagingSenderId: "658234940012",
            appId: "1:658234940012:web:c4015c6d0cc3e291669649"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Danh sách 4 câu hỏi chuẩn
        const danhSachCauHoi = [
            { id: "q1", title: "Câu 1: Khi con nói “Con áp lực quá”, bạn thường nghĩ nên:", opts: { A: "Trấn an để con yên tâm hơn", B: "Nhắc con rằng ai cũng phải trải qua áp lực", C: "Động viên để con cố gắng thêm", D: "Giúp con nhìn nhận vấn đề tích cực hơn" } },
            { id: "q2", title: "Câu 2: Khi con làm bài chưa tốt, phản ứng đầu tiên của bạn thường là:", opts: { A: "Giúp con phân tích lỗi sai để rút kinh nghiệm", B: "Nhắc con cần cẩn thận hơn lần sau", C: "Chỉ ra những điểm con chưa làm tốt", D: "Hướng dẫn con cách làm đúng" } },
            { id: "q3", title: "Câu 3: Việc thường xuyên hỏi con “Hôm nay con học đến đâu rồi?” theo bạn là:", opts: { A: "Thể hiện sự quan tâm sát sao", B: "Giúp con duy trì kỷ luật học tập", C: "Tránh để con bị chểnh mảng", D: "Là cách để ba mẹ nắm được tiến độ học của con" } },
            { id: "q4", title: "Câu 4: Trong giai đoạn ôn thi, bạn nghĩ việc thường xuyên nhắc đến kỳ thi với con là:", opts: { A: "Giúp con luôn ý thức được mục tiêu phía trước", B: "Tạo sự tập trung và nghiêm túc trong học tập", C: "Giúp con không bị sao nhãng bởi những điều khác", D: "Là cách để gia đình cùng quan tâm và đồng hành với con" } }
        ];

        const container = document.getElementById('quiz-container');
        danhSachCauHoi.forEach(q => {
            let html = `
                <div class="question-card">
                    <div class="question-title">${q.title}</div>
                    <button class="btn" id="${q.id}-A" onclick="chon('${q.id}', 'A')">A. ${q.opts.A}</button>
                    <button class="btn" id="${q.id}-B" onclick="chon('${q.id}', 'B')">B. ${q.opts.B}</button>
                    <button class="btn" id="${q.id}-C" onclick="chon('${q.id}', 'C')">C. ${q.opts.C}</button>
                    <button class="btn" id="${q.id}-D" onclick="chon('${q.id}', 'D')">D. ${q.opts.D}</button>
                    <div class="status" id="status-${q.id}">✓ Đã ghi nhận</div>
                </div>
            `;
            container.innerHTML += html;
        });

        function chon(qId, ans) {
            ['A','B','C','D'].forEach(o => {
                const b = document.getElementById(`${qId}-${o}`);
                b.disabled = true;
                if(o === ans) b.classList.add('selected');
            });
            document.getElementById(`status-${qId}`).style.display = 'block';
            database.ref(`quiz_results/${qId}/${ans}`).set(firebase.database.ServerValue.increment(1));
        }
    </script>
</body>
</html>
